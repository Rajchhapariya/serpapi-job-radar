services:
  - type: web
    name: serpapi-job-radar
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: HOST
        value: 0.0.0.0
      - key: DUCKDB_PATH
        value: /tmp/radar.duckdb
      - key: CACHE_TTL_HOURS
        value: "24"
      - key: SEARCH_BUDGET_PER_RUN
        value: "20"
      - key: UNLOCK_RATE_LIMIT
        value: "60"
      - key: SERPAPI_API_KEY
        sync: false
