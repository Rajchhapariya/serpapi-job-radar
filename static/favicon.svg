<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    @media (prefers-color-scheme: dark) {
      .radar-stroke { stroke: #f5f5f5; }
      .radar-fill { fill: #f5f5f5; }
    }
    @media (prefers-color-scheme: light) {
      .radar-stroke { stroke: #111111; }
      .radar-fill { fill: #111111; }
    }
  </style>
  <circle cx="12" cy="12" r="10" class="radar-stroke" stroke="#111111" stroke-width="2" />
  <line x1="12" y1="12" x2="19" y2="5" class="radar-stroke" stroke="#111111" stroke-width="2" stroke-linecap="round" />
  <circle cx="12" cy="12" r="2.5" class="radar-fill" fill="#111111" />
</svg>